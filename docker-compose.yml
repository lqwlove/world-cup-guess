services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wcguess
      POSTGRES_PASSWORD: wcguess
      POSTGRES_DB: wcguess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcguess -d wcguess"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wcguess:wcguess@postgres:5432/wcguess
      DATABASE_URL_SYNC: postgresql://wcguess:wcguess@postgres:5432/wcguess
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - ./seeds:/seeds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wcguess:wcguess@postgres:5432/wcguess
      DATABASE_URL_SYNC: postgresql://wcguess:wcguess@postgres:5432/wcguess
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/api:/app
      - ./seeds:/seeds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: arq app.workers.settings.WorkerSettings

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
