# 示例：/etc/nginx/sites-available/world-cup-guess
# 对外 HTTP 端口 8081（不用 HTTPS）
#
# 启用:
#   sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/world-cup-guess
#   sudo ln -sf /etc/nginx/sites-available/world-cup-guess /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 安全组放行: 8081
# 访问: http://公网IP:8081/
#
# Docker 映射:
#   127.0.0.1:3000 → web
#   127.0.0.1:8000 → api
#
# .env.production（无末尾斜杠）:
#   NEXT_PUBLIC_API_URL=http://公网IP:8081
#   CORS_ORIGINS=http://公网IP:8081

upstream wcguess_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream wcguess_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 8081;
    server_name _;   # 用 IP 访问时可保持 _

    client_max_body_size 10m;

    # ---------- 合议 SSE（须放在 /api/ 之前）----------
    location ~ ^/api/discussions/[^/]+/stream$ {
        proxy_pass http://wcguess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://wcguess_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://wcguess_api/health;
        access_log off;
    }

    location /docs {
        proxy_pass http://wcguess_api/docs;
    }

    location /openapi.json {
        proxy_pass http://wcguess_api/openapi.json;
    }

    # ---------- Next.js ----------
    location /_next/ {
        proxy_pass http://wcguess_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://wcguess_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
